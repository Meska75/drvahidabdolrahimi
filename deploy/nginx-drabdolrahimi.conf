# کانفیگ Nginx پروداکشن — دکتر عبدالرحیمی
# مسیر روی سرور معمولاً: /etc/nginx/sites-available/drabdolrahimi
# این فایل مرجع لوکال است تا هنگام دیپلوی تنظیمات SSL دامنه‌ها از بین نرود.
#
# نکته آپلود: برای فایل‌های بزرگ، روی سرور این مقادیر را هم در هر بلوک location /
# (یا در سطح server) اضافه کنید اگر هنوز نیست:
#   proxy_connect_timeout 300s;
#   proxy_send_timeout    300s;
#   proxy_read_timeout    300s;
#   send_timeout          300s;
#   client_body_timeout   300s;

server {
    server_name drabdolrahimi.ir www.drabdolrahimi.ir;
    client_max_body_size 100M;

    location /static/ {
        alias /var/www/drabdolrahimi/static/;
        expires 30d;
    }
    location /media/ {
        alias /var/www/drabdolrahimi/media/;
    }
    location / {
        proxy_pass http://unix:/run/drabdolrahimi/drabdolrahimi.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/drabdolrahimi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drabdolrahimi.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name drabdolrahimi.com www.drabdolrahimi.com;
    client_max_body_size 100M;

    location /static/ {
        alias /var/www/drabdolrahimi/static/;
        expires 30d;
    }
    location /media/ {
        alias /var/www/drabdolrahimi/media/;
    }
    location / {
        proxy_pass http://unix:/run/drabdolrahimi/drabdolrahimi.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/drabdolrahimi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drabdolrahimi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.drabdolrahimi.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = drabdolrahimi.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.drabdolrahimi.ir) {
        return 301 https://$host$request_uri;
    }
    if ($host = drabdolrahimi.ir) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name drabdolrahimi.ir www.drabdolrahimi.ir
                drabdolrahimi.com www.drabdolrahimi.com;
    return 404;
}
