{% load static %}
<div id="dr-chatbot-root"
     class="dr-chatbot"
     dir="{{ chatbot_direction }}"
     data-lang="{{ chatbot_language }}"
     data-config="{% url 'chatbot:config' %}"
     data-start="{% url 'chatbot:start' %}"
     data-stream="{% url 'chatbot:stream' %}"
     data-clear="{% url 'chatbot:clear' %}">
    <button type="button" class="dr-chatbot-launcher" id="drChatbotLauncher" aria-expanded="false">
        {# طرح متحرک دستیار به‌جای آیکون — در دسکتاپ و موبایل #}
        <span class="dr-chatbot-launcher-anim" id="drChatbotAnim" aria-hidden="true"></span>
        <span class="dr-chatbot-launcher-label"></span>
    </button>

    <section class="dr-chatbot-panel" id="drChatbotPanel" hidden>
        <header class="dr-chatbot-head">
            <div>
                <strong class="dr-chatbot-title"></strong>
                <p class="dr-chatbot-sub"></p>
            </div>
            <div class="dr-chatbot-head-actions">
                <button type="button" class="dr-chatbot-clear" id="drChatbotClear" aria-label="clear">
                    <i class="fa fa-trash"></i>
                </button>
                <button type="button" class="dr-chatbot-close" id="drChatbotClose" aria-label="close">
                    <i class="fa fa-times"></i>
                </button>
            </div>
        </header>
        <div class="dr-chatbot-messages" id="drChatbotMessages"></div>
        <form class="dr-chatbot-form" id="drChatbotForm" autocomplete="off">
            {% csrf_token %}
            <label class="dr-chatbot-honeypot" aria-hidden="true">
                <input type="text" name="dr_hp" tabindex="-1" autocomplete="off" value="">
            </label>
            <textarea id="drChatbotInput" rows="2" maxlength="2000" required></textarea>
            <button type="submit" id="drChatbotSend">
                <i class="fa fa-paper-plane"></i>
            </button>
        </form>
    </section>
</div>
<link rel="stylesheet" href="{% static 'chatbot/widget.css' %}">
<script type="module">
    import { setWasmUrl } from "{% static 'chatbot/vendor/dotlottie-wc.js' %}";
    setWasmUrl("{% static 'chatbot/vendor/dotlottie-player.wasm' %}");
    var slot = document.getElementById('drChatbotAnim');
    if (slot && !slot.firstElementChild) {
        var player = document.createElement('dotlottie-wc');
        player.setAttribute('src', "{% static 'chatbot/ai-assistant.lottie' %}");
        player.setAttribute('autoplay', '');
        player.setAttribute('loop', '');
        player.setAttribute('marker', 'idle');
        slot.appendChild(player);
    }
</script>
<script src="{% static 'chatbot/widget.js' %}" defer></script>
