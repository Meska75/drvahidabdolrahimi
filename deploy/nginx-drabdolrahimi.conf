# کانفیگ Nginx پروداکشن — دکتر عبدالرحیمی
# مسیر روی سرور معمولاً: /etc/nginx/sites-available/drabdolrahimi
# این فایل مرجع لوکال است تا هنگام دیپلوی تنظیمات SSL دامنه‌ها از بین نرود.
#
# دامنهٔ اصلی و تنها نسخه‌ای که گوگل باید ایندکس کند:
#   https://drabdolrahimi.com
# بقیه (www.com و .ir و www.ir و HTTP) با ۳۰۱ به همان آدرس می‌روند.
#
# بعد از تغییر این فایل روی سرور:
#   sudo nginx -t && sudo systemctl reload nginx

# فقط دامنهٔ اصلی محتوا را سرو می‌کند
server {
    server_name drabdolrahimi.com;
    client_max_body_size 100M;

    location /static/ {
        alias /var/www/drabdolrahimi/static/;
        expires 30d;
    }
    location /media/ {
        alias /var/www/drabdolrahimi/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
    # جریان پاسخ چت نباید در بافر بماند، وگرنه متن یکجا می‌آید یا اصلاً نمی‌رسد
    location /chatbot/stream/ {
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
        client_body_timeout   300s;
        proxy_pass http://unix:/run/drabdolrahimi/drabdolrahimi.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
        client_body_timeout   300s;
        proxy_pass http://unix:/run/drabdolrahimi/drabdolrahimi.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/drabdolrahimi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drabdolrahimi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www.com به دامنهٔ اصلی
server {
    listen 443 ssl;
    server_name www.drabdolrahimi.com;
    ssl_certificate /etc/letsencrypt/live/drabdolrahimi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drabdolrahimi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://drabdolrahimi.com$request_uri;
}

# .ir و www.ir به دامنهٔ اصلی — گواهی .ir باید بماند تا مرورگر قبل از ریدایرکت خطا ندهد
server {
    listen 443 ssl;
    server_name drabdolrahimi.ir www.drabdolrahimi.ir;
    ssl_certificate /etc/letsencrypt/live/drabdolrahimi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drabdolrahimi.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://drabdolrahimi.com$request_uri;
}

# HTTP همهٔ دامنه‌ها مستقیم به نسخهٔ امن دامنهٔ اصلی
server {
    listen 80;
    server_name drabdolrahimi.ir www.drabdolrahimi.ir
                drabdolrahimi.com www.drabdolrahimi.com;
    return 301 https://drabdolrahimi.com$request_uri;
}
